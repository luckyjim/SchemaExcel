[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-project"
version = "0.1.0"
description = "A Python project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Colley Jean-Marc", email = "jcolley@lpnhe.in2p3.fr"}
]
keywords = ["python", "project"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [ # Base requirements
    "pyexcel",
    "pyexcel-xls",
    "pyexcel-xlsx",
]

[project.urls]
Homepage = "https://github.com/luckyjim/SchemaExcel"
Repository = "https://github.com/luckyjim/SchemaExcel.git"
Issues = "https://github.com/luckyjim/SchemaExcel/issues"

